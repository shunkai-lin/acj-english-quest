<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(160deg,#fff7e6,#e8f4ff);min-height:100vh;color:#1f3b57;user-select:none}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.hide{display:none!important}
.topbar{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 4px 14px rgba(0,0,0,.07);margin-bottom:16px}

.who{font-weight:700;font-size:28px;flex:1}

.opts{margin-top:20px}

.opt.ok{border-color:#22c55e;background:#dcfce7}
.opt.no{border-color:#f87171;background:#fee2e2;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.opt .em{font-size:108px;line-height:1.1}
.opt .sw{width:130px;height:130px;border-radius:24px;border:2px solid rgba(0,0,0,.12)}

.prog{display:flex;gap:6px;justify-content:center;margin:14px 0}
.dot{width:44px;height:16px;border-radius:8px;background:#e2e8f0}
.dot.d{background:#22c55e}.dot.x{background:#f87171}
.toast{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:110px;z-index:50}
.gacha{background:linear-gradient(135deg,#fbcfe8,#fecaca);border-radius:20px;padding:16px;text-align:center;margin-bottom:16px;border:3px solid #ec4899}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.mbox{background:#fff;border-radius:24px;padding:28px 22px;text-align:center;max-width:400px;width:100%}
.mbox img{width:250px;height:250px;object-fit:contain}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:14px}
.coll div{background:#fff;border-radius:16px;padding:8px;text-align:center;font-size:18px}
.coll img{width:100%}
input{font-family:inherit;font-size:28px;padding:12px;border:2px solid #cbd5e1;border-radius:12px;width:100%;text-align:center}
.foot{text-align:center;margin-top:24px}
@media(max-width:520px){.g3{grid-template-columns:1fr 1fr}.qword{font-size:60px}.qword.sent{font-size:30px}.qpic{font-size:88px}.opt .pk{width:108px;height:108px}.opt.tk .em{font-size:48px}.opt.tk .cw{font-size:21px}.opt.tk .tx{font-size:20px}.opt .em{font-size:76px}.opt .sw{width:96px;height:96px}.spk{width:104px;height:104px;font-size:50px}.h1,h1{font-size:30px}}

<body>
<div class="wrap">

  <!-- 開場：輸入代碼 -->
  <div id="scLogin">

    <div class="foot">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAQll2Xvf321l3c9WYQehXFinMXY6u8LGc",
  authDomain: "classroom-gacha-rewards.firebaseapp.com",
  projectId: "classroom-gacha-rewards",
  storageBucket: "classroom-gacha-rewards.firebasestorage.app",
  messagingSenderId: "508693241214",
  appId: "1:508693241214:web:8d8c0dbb5ee0dfca5de72f"
};
const db = getFirestore(initializeApp(firebaseConfig));
const COL = "acjenglish";          // 獨立集合，與加分網站 classes / kitty 互不干擾
const GOAL = 10;
const CODE_KEY = "acj_code";

const $ = id => document.getElementById(id);
const show = id => ["scLogin","scMain","scQuiz","scColl"].forEach(s => $(s).classList.toggle("hide", s !== id));

// ---------- 資料 ----------
let code = "", me = null, unsub = null;
const blank = () => {
  const levels = {}, streak = {};
  TOPICS.forEach(t => { levels[t.id] = t.minLev; streak[t.id] = 0; });
  // srs：每張字卡一筆 { c:連續答對次數, due:下次該出現的時間 }，key 是 "關卡:單字"
  return { name:"皙潔", avatar:"🦄", score:0, collection:[], levels, streak, srs:{}, seen2:false };
};
// 目前等級：不得低於該關的起跳難度（第二批一開始就沒有中文提示）
// 答錯扣 0.5 分，所以分數可能有小數；整數就不要顯示 .0
const fmt = n => (Math.round(n * 10) / 10).toString();
const lvOf = t => Math.max(t.minLev, me.levels[t.id] || t.minLev);
// 第一批三關都到 UNLOCK_LEVEL 才解鎖第二批
const unlocked2 = () => TOPICS.filter(t => t.batch === 1).every(t => (me.levels[t.id] || 1) >= UNLOCK_LEVEL);

// 沿用加分網站的資料形狀（students / prizes），扭蛋與圖鑑模組可直接共用
const save = () => setDoc(doc(db, COL, code), { students:[me], prizes:[] });

async function load(c){
  code = c; localStorage.setItem(CODE_KEY, c);
  const ref = doc(db, COL, c);
  const snap = await getDoc(ref);
  if (!snap.exists()) { me = blank(); await save(); }
  if (unsub) unsub();
  unsub = onSnapshot(ref, s => {
    const d = s.data(); if (!d || !d.students || !d.students[0]) return;
    me = Object.assign(blank(), d.students[0]);
    render();
  });
}

// ---------- 發音 ----------
// Chrome/Edge 的兩個老毛病：
//  1) cancel() 之後「立刻」speak() 會被吞掉 → 一律隔一小段時間再送
//  2) 閒置一陣子後 speechSynthesis 會卡住不發聲 → 送出前先 resume()
const TTS = window.speechSynthesis || null;
let voice = null, ttsReady = false;

function pickVoice(){
  if (!TTS) return;
  const vs = TTS.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  if (!vs.length) return;
  voice = vs.find(v => /Google US English|Samantha|Zira|Aria/i.test(v.name))
       || vs.find(v => /en-US/i.test(v.lang)) || vs[0];
  ttsReady = true;
}
if (TTS){ TTS.onvoiceschanged = pickVoice; pickVoice(); }

let speakTimer = null;
// delay：想讓提示音先響完再唸字時用（兩個一起出來會互相削波，聽起來就是破音）
function speak(text, rate = 0.85, delay = 0){
  if (!TTS) return;
  clearTimeout(speakTimer);
  const busy = TTS.speaking || TTS.pending;
  try { if (busy) TTS.cancel(); } catch(e){}   // 沒在唸就不要 cancel，白白多一次卡頓
  speakTimer = setTimeout(() => {
    try{
      if (!ttsReady) pickVoice();          // 語音清單可能到現在才載好
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US";
      u.rate   = rate;
      u.pitch  = 1;      // 破音主因：音高拉到 1.1，Windows／Android 內建語音會出現金屬撕裂聲
      u.volume = .85;    // 滿音量在手機小喇叭上會削波，退一點反而更清楚
      if (voice) u.voice = voice;
      if (TTS.paused) TTS.resume();
      TTS.speak(u);
    }catch(e){}
  }, delay + (busy ? 200 : 60));           // cancel 完要多留一點時間，不然尾音會被切成破的
}
// 有些瀏覽器閒置後會自動 pause，定時戳一下維持可用（正在唸／排隊中就別戳，會把字弄斷）
setInterval(() => { try{ if (TTS && !TTS.speaking && !TTS.pending) TTS.resume(); }catch(e){} }, 8000);

// 提示音：整頁共用一個 AudioContext。原本每按一次就 new 一個，Chrome 上限約 6 個，
// 超過就開不出來，還沒超過時也會互相搶資源，聲音跟著糊掉。
let AC = null;
function actx(){
  const C = window.AudioContext || window.webkitAudioContext;
  if (!C) return null;
  if (!AC) AC = new C();
  if (AC.state === "suspended") { try { AC.resume(); } catch(e){} }
  return AC;
}
function beep(ok){
  try{
    const ac = actx(); if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = ok ? 880 : 220;
    const t = ac.currentTime, dur = ok ? .16 : .25;
    // 音量做斜坡進出。原本直接 gain=.12 硬開硬關，頭尾各有一聲「啪」的爆音
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.07, t + .02);
    g.gain.setValueAtTime(.07, t + dur - .06);
    g.gain.linearRampToValueAtTime(0, t + dur);
    o.start(t); o.stop(t + dur + .02);
  }catch(e){}
}

// ---------- 難度：依等級決定「拿掉多少輔助」（見 docs/設計.md） ----------
// L1 圖+音+中文 2選1 ／ L2 圖+音+英文 3選1 ／ L3 只有音 3選1 ／ L4 只有音 4選1
const rule = lv => ({
  1:{ showWord:true,  showZh:true,  n:2 },
  2:{ showWord:true,  showZh:false, n:3 },
  3:{ showWord:false, showZh:false, n:3 },
  4:{ showWord:false, showZh:false, n:4 }
}[Math.min(4, Math.max(1, lv))]);

const shuffle = a => a.slice().sort(() => Math.random() - .5);

// ---------- SRS 間隔重複（Anki 的邏輯，但沒有那四顆難易度按鈕） ----------
// 難易度由「她自己連續答對幾次」決定：連續答對 2 次以上，這張卡就隔幾天才再出現。
// 六歲不會也不該自評「簡單／普通／困難」，所以間隔完全由答題結果推出來。
const MIN = 60000, DAY = 86400000;
const GAP = [1*MIN, 10*MIN, 1*DAY, 3*DAY, 7*DAY, 15*DAY, 30*DAY];   // 依 c（連續答對次數）取
const srsKey = (topic, item) => topic.id + ":" + item.word;
const srsOf = (topic, item) => (me.srs && me.srs[srsKey(topic, item)]) || null;

// 答完一題就更新這張卡：答對往後推、答錯（或先錯後對）打回重來
function srsGrade(topic, item, ok){
  if (!me.srs) me.srs = {};
  const k = srsKey(topic, item);
  const c = ok ? Math.min(GAP.length - 1, ((me.srs[k] && me.srs[k].c) || 0) + 1) : 0;
  me.srs[k] = { c, due: Date.now() + GAP[c] };
}

// 挑這一關要出的 5 張卡：到期的先出 → 沒看過的 → 都不到期就挑最快到期的
// 連續答對 2 次以上的卡 due 會落在幾天後，等於自動退出這一輪，不會一直重複問同一題
function pickCards(topic, lv, n){
  const now = Date.now();
  const pool = topic.items.filter(it => it.level <= lv);
  const due = [], fresh = [], later = [];
  shuffle(pool).forEach(it => {
    const r = srsOf(topic, it);
    if (!r) fresh.push(it);
    else if (r.due <= now) due.push([r.due, it]);
    else later.push([r.due, it]);
  });
  due.sort((a, b) => a[0] - b[0]);
  later.sort((a, b) => a[0] - b[0]);
  const out = due.map(x => x[1]);
  for (const it of fresh) { if (out.length >= n) break; out.push(it); }
  for (const x of later) { if (out.length >= n) break; out.push(x[1]); }
  return out.slice(0, n);
}

// 地圖上顯示「現在有幾張該複習」
function dueCount(topic){
  const now = Date.now(), lv = lvOf(topic);
  return topic.items.filter(it => {
    if (it.level > lv) return false;
    const r = srsOf(topic, it);
    return !r || r.due <= now;
  }).length;
}

// ---------- 出題 ----------
let quiz = null, locked = false;

function startQuiz(topic){
  if (topic.batch === 2 && !unlocked2()) return;
  const lv = lvOf(topic);
  const qs = pickCards(topic, lv, 5);
  quiz = { topic, qs: qs.length ? qs : shuffle(topic.items).slice(0,5), i:0, log:[], miss:false };
  $("quizTitle").textContent = topic.icon + " " + topic.name + "　第 " + lv + " 級";
  locked = false;
  show("scQuiz"); nextQ();
}

// 題目要唸的是哪一句：對話關唸「對方說的話」，其他關唸單字本身
const askOf = (topic, item) => topic.kind === "talk" ? item.ask : item.word;

function faceHTML(topic, item){
  if (topic.kind === "pic") return '<img class="pk" src="' + item.img + '" alt="">';
  if (topic.kind === "color") return '<div class="sw" style="background:' + item.img + '"></div>';
  if (topic.kind === "count") {
    // 超過 12 個就別排 emoji 了，六歲數不完 —— 直接秀阿拉伯數字
    if (item.img > COUNT_MAX_EMOJI) return '<div class="tx" style="font-size:88px">' + item.zh + '</div>';
    const e = COUNT_EMOJI[Math.floor(Math.random() * COUNT_EMOJI.length)];
    return '<div class="cnt">' + (item.img ? e.repeat(item.img) : "🚫") + '</div>';
  }
  return '<div class="em">' + item.img + '</div>';
}

function nextQ(){
  if (quiz.i >= quiz.qs.length) return finishQuiz();
  const topic = quiz.topic, item = quiz.qs[quiz.i];
  const lv = lvOf(topic), r = rule(lv);

  $("prog").innerHTML = quiz.qs.map((_, k) =>
    '<div class="dot ' + (quiz.log[k] === true ? 'd' : quiz.log[k] === false ? 'x' : '') + '"></div>').join("");

  quiz.miss = false;                 // 這一題答錯過沒有 —— 先錯後對不算「連續答對」

  // 對話關：上面先出一張情境圖，唸的是「對方說的話」，選項才是回答
  const talk = topic.kind === "talk";
  $("qpic").textContent = talk ? item.scene : "";
  $("qpic").classList.toggle("hide", !talk);
  $("qword").className = "qword" + (talk && r.showWord ? " sent" : "");   // 只有真的秀出整句時才縮字級，🎧 維持大圖示
  $("qword").textContent = r.showWord ? askOf(topic, item) : "🎧";
  $("qhint").textContent = talk
    ? (r.showWord ? (r.showZh ? "他說：" + item.askZh : "他說了什麼？要怎麼回答？")
                  : "只用耳朵聽，選出正確的回答！")
    : (r.showWord ? (r.showZh ? "聽聽看：" + item.zh : "這個字是什麼意思？")
                  : "只用耳朵聽，選出正確的！");
  speak(askOf(topic, item));

  const others = shuffle(topic.items.filter(x => x.word !== item.word));
  const opts = shuffle([item].concat(others.slice(0, r.n - 1)));

  // 顏色關的色塊自己不會說話（薄荷綠／奶油色這種更是分不出來），一律把英文單字寫在色塊下面
  // 對話關的選項是整句回答，一定要把英文句子寫出來（小圖只是幫她縮小範圍）
  const showOptWord = topic.kind === "color" || talk;
  $("opts").innerHTML = opts.map(o =>
    '<div class="opt' + (talk ? ' tk' : '') + '" data-w="' + o.word + '">' + faceHTML(topic, o) +
    (showOptWord ? '<div class="tx cw">' + o.word + '</div>' : '') +
    (r.showZh ? '<div class="tx">' + o.zh + '</div>' : '') + '</div>').join("");

  [...$("opts").children].forEach(el =>
    el.onclick = () => answer(el, el.dataset.w === item.word, item));
}

function answer(el, ok, item){
  if (locked) return;
  locked = true;
  const t = quiz.topic.id;
  if (ok){
    el.classList.add("ok"); beep(true); toast("🎉");
    me.score++;
    srsGrade(quiz.topic, item, !quiz.miss);   // 先錯後對 → 不算答對，這張卡等一下還會出現
    me.streak[t] = Math.max(0, me.streak[t] || 0) + 1;
    if (me.streak[t] >= 4){ me.streak[t] = 0; me.levels[t] = Math.min(4, lvOf(quiz.topic) + 1); }
    quiz.log[quiz.i] = true; quiz.i++;
    speak(item.word, .85, 240);            // 等「答對」的提示音響完再唸，兩個疊在一起會破音
    save();
    setTimeout(() => { locked = false; nextQ(); }, 950);
  } else {
    el.classList.add("no"); beep(false);
    quiz.miss = true;
    me.score = Math.max(0, me.score - 0.5);   // 答錯扣 0.5 分（不會扣成負的）
    srsGrade(quiz.topic, item, false);        // 這張卡打回重來，等一下再問一次
    me.streak[t] = Math.min(0, me.streak[t] || 0) - 1;
    if (me.streak[t] <= -2){ me.streak[t] = 0; me.levels[t] = Math.max(quiz.topic.minLev, lvOf(quiz.topic) - 1); }
    quiz.log[quiz.i] = false;   // 記錄答錯，可以再試；同一題答對就換下一題，所以只會扣一次
    save();
    setTimeout(() => { el.classList.remove("no"); locked = false; speak(askOf(quiz.topic, item), .85); }, 700);
  }
}

function finishQuiz(){
  const right = quiz.log.filter(Boolean).length;
  modal('<div style="font-size:70px">' + (right >= 4 ? "🏆" : "👍") + '</div>' +
    '<h2 style="margin:10px 0">這關答對 ' + right + ' 題！</h2>' +
    '<p style="color:#64748b">目前 ' + fmt(me.score) + ' 分' +
      (me.score >= GOAL ? "，可以扭蛋囉 🎰" : "，再 " + fmt(GOAL - me.score) + " 分可以扭蛋") + '</p>' +
    '<div style="margin-top:18px"><button class="btn g" id="mAgain">再玩一次</button> ' +
    '<button class="btn s" id="mBack">回地圖</button></div>');
  $("mAgain").onclick = () => { closeModal(); startQuiz(quiz.topic); };
  $("mBack").onclick  = () => { closeModal(); show("scMain"); };
  save();
}

// ---------- 扭蛋（沿用加分網站規則：滿 10 分、扣 10 分） ----------
function gacha(){
  if (me.score < GOAL) return;
  me.score -= GOAL;
  const p = POKEMON_LIST[Math.floor(Math.random() * POKEMON_LIST.length)];
  const isNew = !me.collection.some(c => c.name === p.name);
  me.collection.push({ type:"pokemon", name:p.name, img:p.img, time:new Date().toISOString() });
  save();
  modal('<div style="font-size:56px">🎊</div><img src="' + p.img + '" alt="">' +
    '<h2 style="margin:6px 0">' + p.name + '</h2>' +
    '<p style="color:' + (isNew ? "#e11d48" : "#64748b") + ';font-weight:700">' +
      (isNew ? "✨ 新的！" : "已經有了，再收一隻") + '</p>' +
    '<div style="margin-top:16px"><button class="btn p" id="mOk">收下 ✓</button></div>');
  $("mOk").onclick = closeModal;
}

// ---------- UI ----------
function render(){
  if (!me) return;
  $("avatar").textContent = me.avatar || "🦄";
  $("who").textContent = me.name || "皙潔";
  $("scoreNum").textContent = fmt(me.score);
  $("scoreNum2").textContent = fmt(me.score);
  $("gachaBox").classList.toggle("hide", me.score < GOAL);
  const open2 = unlocked2();
  const cardsOf = b => TOPICS.filter(t => t.batch === b).map(t => {
    const lock = (b === 2 && !open2);
    return '<div class="card' + (lock ? ' lock' : '') + '" data-t="' + t.id + '">' +
      '<span class="ic">' + (lock ? "🔒" : t.icon) + '</span>' +
      '<div class="nm">' + t.name + '</div>' +
      '<div class="lv">' + (lock ? "還沒解鎖"
        : "第 " + lvOf(t) + " 級・複習 " + dueCount(t) + " 張") + '</div></div>';
  }).join("");
  $("topicGrid").innerHTML =
    '<div class="bt">第一批　基礎關卡</div>' + '<div class="grid g3">' + cardsOf(1) + '</div>' +
    '<div class="bt">第二批　進階關卡' + (open2 ? '' : '　🔒 第一批三關都到第 ' + UNLOCK_LEVEL + ' 級就打開') + '</div>' +
    '<div class="grid g3">' + cardsOf(2) + '</div>' +
    '<div class="bt">第三批　新題型　💬 聽對話選回答／⚡ 看圖記英文名</div>' +
    '<div class="grid g3">' + cardsOf(3) + '</div>';
  [...$("topicGrid").querySelectorAll(".card:not(.lock)")].forEach(el =>
    el.onclick = () => startQuiz(TOPICS.find(t => t.id === el.dataset.t)));

  // 剛解鎖第二批：放一次晉級動畫（只放一次）
  // 注意：render() 由 onSnapshot 觸發，可能正在答題中途 —— 要等回到地圖再放，別打斷她
  if (open2 && !me.seen2 && !$("scMain").classList.contains("hide")){
    me.seen2 = true; save();
    modal('<div style="font-size:80px">🎓</div><h2 style="margin:10px 0">晉級第二批！</h2>' +
      '<p style="color:#64748b;font-size:20px">解鎖 7 個新關卡：食物、身體、人物、交通、形狀、學校、天氣<br>' +
      '新關卡比較難，<b>一開始就沒有中文提示</b>喔！<br>第一批隨時都可以回去玩 💛</p>' +
      '<div style="margin-top:18px"><button class="btn g" id="mOk2">我準備好了！</button></div>');
    $("mOk2").onclick = closeModal;
  }
  $("collNum").textContent = me.collection.length;
}

function toast(t){
  const el = $("toast"); el.textContent = t; el.classList.remove("hide");
  setTimeout(() => el.classList.add("hide"), 700);
}
const modal = html => { $("mbox").innerHTML = html; $("modal").classList.remove("hide"); };
const closeModal = () => $("modal").classList.add("hide");

$("btnLogin").onclick = () => {
  const c = $("codeInput").value.trim().toLowerCase();
  if (!c) return alert("請先輸入代碼");
  actx();                              // 順便解鎖 AudioContext（手機一定要在點擊當下開）
  speak("Hello");                      // 順便解鎖手機瀏覽器的語音權限
  load(c).then(() => show("scMain"));
};
$("codeInput").addEventListener("keydown", e => { if (e.key === "Enter") $("btnLogin").click(); });
$("btnSpeak").onclick    = () => { if (quiz && quiz.qs[quiz.i]) speak(askOf(quiz.topic, quiz.qs[quiz.i]), .85); };
$("btnBack").onclick     = () => show("scMain");
$("btnGacha").onclick    = gacha;
$("btnOut").onclick      = () => { localStorage.removeItem(CODE_KEY); location.reload(); };
$("btnColl").onclick     = () => {
  $("collGrid").innerHTML = me.collection.length
    ? me.collection.map(c => '<div><img src="' + c.img + '"><div>' + c.name + '</div></div>').join("")
    : '<p style="color:#64748b">還沒有寶可夢，去闖關賺分數吧！</p>';
  show("scColl");
};
$("btnCollBack").onclick = () => show("scMain");
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };

const saved = localStorage.getItem(CODE_KEY);
if (saved) { $("codeInput").value = saved; load(saved).then(() => show("scMain")); }
</script>
